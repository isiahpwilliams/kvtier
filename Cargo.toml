[workspace]
members = ["kvtier-py"]

[package]
name = "kvtier"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1"
libc = "0.2.189"
memmap2 = "0.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }

[profile.release]
debug = true

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "lookup"
harness = false
